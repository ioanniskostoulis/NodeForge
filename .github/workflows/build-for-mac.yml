name: Build for mac

# Checks, builds and publishes the macOS app only. Run it by hand.
# Generated by `forge-shell workflows`; edit forge-shell, not this file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-for-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:app
      - run: npm run test:shell

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/check-release.mjs --mac
      - uses: actions/upload-artifact@v4
        with:
          name: forge-macos
          path: build/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [checks, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-*
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(cat VERSION)"; fi
          APP_NAME="$(node -p 'require("./forge.config.json").identity.name')"
          npx forge-shell release-notes > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "$APP_NAME ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
