name: Build for windows

# Checks, builds and publishes the Windows app only. Run it by hand.
# Generated by `forge-shell workflows`; edit forge-shell, not this file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-for-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:app
      - run: npm run test:shell

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/check-release.mjs --win
      - name: Launch packaged app and check screenshot
        shell: pwsh
        run: ./scripts/check-windows-capture.ps1
      - name: Open setup window and check screenshot
        shell: pwsh
        env:
          FORGE_CAPTURE: ${{ github.workspace }}/build/release/setup-window.png
        run: |
          $setup = Get-ChildItem build/release/*-v*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $setup.FullName -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw 'The setup window did not close within 180 s.' }
          if ($process.ExitCode -ne 0) { throw "The setup window exited $($process.ExitCode), expected 0." }
          if (-not (Test-Path $env:FORGE_CAPTURE)) { throw 'The setup window was not captured.' }
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Bitmap]::FromFile($env:FORGE_CAPTURE)
          $colors = @{}
          for ($x = 0; $x -lt $image.Width; $x += 8) { for ($y = 0; $y -lt $image.Height; $y += 8) { $colors[$image.GetPixel($x, $y).ToArgb()] = 1 } }
          Write-Host "Setup window: $($image.Width) x $($image.Height) screenshot, $($colors.Count) colours."
          $image.Dispose()
          if ($colors.Count -lt 3) { throw 'The setup window screenshot is blank.' }
      - name: Check Windows installer upgrades
        shell: pwsh
        env:
          FORGE_SETUP_LOG_DIR: ${{ github.workspace }}/build/release/setup-log
        run: ./scripts/check-windows-installer.ps1
      - name: Show setup log
        if: failure()
        shell: pwsh
        run: Get-Content build/release/setup-log/*.log -ErrorAction SilentlyContinue
      - name: Save setup log and crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-log
          path: build/release/setup-log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-screenshot
          path: |
            build/release/windows-launch.png*
            build/release/setup-window.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows
          path: build/release/*-v*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [checks, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-*
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(cat VERSION)"; fi
          APP_NAME="$(node -p 'require("./forge.config.json").identity.name')"
          npx forge-shell release-notes > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "$APP_NAME ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
