name: Clear all

# Deletes every release, tag and workflow run of the repository; it builds nothing and cannot be undone. Run it by hand and type "clear all" to confirm.
# Generated by `forge-shell workflows`; edit forge-shell, not this file.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "clear all" to delete every release, tag and workflow run.
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: clear-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        run: |
          if [ "${{ inputs.confirm }}" != "clear all" ]; then
            echo 'Nothing was deleted. Type "clear all" in the confirm box to delete every release, tag and workflow run.'
            exit 1
          fi
      - name: Delete every release, tag and workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # releases first, with their tags
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            gh release delete "$tag" --yes --cleanup-tag
          done
          # then any tag that never had a release
          for ref in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --paginate --jq '.[].ref'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" || true
          done
          # then the run history, so that deleted workflows leave the Actions sidebar; this run is kept
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs" --paginate --jq '.workflow_runs[].id'); do
            [ "$run" = "$GITHUB_RUN_ID" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run" || true
          done
          echo "Deleted all releases, tags and workflow runs."
